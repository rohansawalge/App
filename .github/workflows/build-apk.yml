name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          unzip -q -o "$ZIP" -d src
          PROJ=$(dirname $(find src -name settings.gradle.kts | head -n 1))
          echo "PROJ=$PROJ" >> $GITHUB_ENV

      - name: Set server address (optional)
        if: ${{ vars.API_URL != '' }}
        run: |
          echo "window.GATE_CONFIG = { API_URL: \"${{ vars.API_URL }}\" };" > "$PROJ/app/src/main/assets/www/config.js"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GATE-ME-Notes-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
